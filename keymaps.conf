# tmux reloading
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Split panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style directional pane switches (prefix table)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (prefix table, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# Seamless nvim/tmux pane nav w/ ctrl+shift+hjkl, single key, no prefix
# (pairs with vim-tmux-navigator in nvim; when the active pane is running
# vim/nvim, forward the keystroke to it instead of moving the tmux pane)
# nvim-side mapping must match.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-S-h if-shell "$is_vim" "send-keys C-S-h" "select-pane -L"
bind-key -n C-S-j if-shell "$is_vim" "send-keys C-S-j" "select-pane -D"
bind-key -n C-S-k if-shell "$is_vim" "send-keys C-S-k" "select-pane -U"
bind-key -n C-S-l if-shell "$is_vim" "send-keys C-S-l" "select-pane -R"
bind-key -n 'C-S-\' if-shell "$is_vim" "send-keys 'C-S-\\'" "select-pane -l"

bind-key -T copy-mode-vi C-S-h select-pane -L
bind-key -T copy-mode-vi C-S-j select-pane -D
bind-key -T copy-mode-vi C-S-k select-pane -U
bind-key -T copy-mode-vi C-S-l select-pane -R
bind-key -T copy-mode-vi 'C-S-\' select-pane -l

# Document viewer (Markdown / PDF / Files) with auto-install
bind-key o display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "~/.config/tmux/scripts/view_doc.sh"
bind-key O display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "~/.config/tmux/scripts/pick_and_view.sh"

# Hide / retrieve panes (multi-pane stack)
bind-key - run-shell "~/.config/tmux/scripts/pane_stash.sh hide"
bind-key + run-shell "~/.config/tmux/scripts/pane_stash.sh pop"
bind-key = run-shell "~/.config/tmux/scripts/pane_stash.sh menu"


