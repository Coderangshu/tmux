# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configure Catppuccin (must be set before tpm runs catppuccin.tmux)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# pin plugin dir — tpm auto-detects ~/.config/tmux/plugins when
# ~/.config/tmux/tmux.conf exists, but plugins are installed under ~/.tmux/plugins
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{HOME}/.tmux/plugins/"

# Ensure TPM and all configured plugins are installed before initializing TPM
run '~/.config/tmux/scripts/ensure_plugins.sh'

# Initialize TMUX plugin manager (must run after plugin/catppuccin config above)
run '~/.tmux/plugins/tpm/tpm'

