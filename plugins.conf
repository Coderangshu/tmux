# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'


# Configure Catppuccin (must be set before tpm runs catppuccin.tmux)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"


# pin plugin dir — tpm auto-detects ~/.config/tmux/plugins when
# ~/.config/tmux/tmux.conf exists, but plugins are installed under ~/.tmux/plugins
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{HOME}/.tmux/plugins/"

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (must run after plugin/catppuccin config above)
run '~/.tmux/plugins/tpm/tpm'
